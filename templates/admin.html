{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        /* Basic styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        /* Navigation bar styling */
        .navbar {
            background-color: #333;
            overflow: hidden;
            width: 95%;
            padding: 10px 50px; /* Adjusted padding for the navbar */
            display: flex; /* Use flexbox for alignment */
            align-items: center; /* Center items vertically */
        }

        .navbar h1 {
            color: white; /* White text for the heading */
            margin: 0; /* Remove default margin */
            flex-grow: 1; /* Allow the heading to take remaining space */
            text-align: left; /* Align text to the left */
            padding-left: 40px; /* Increased padding to move it more to the right */
        }

        .navbar a {
            display: block;
            color: white;
            text-align: center;
            padding: 15px 20px; /* Adjusted padding for the navbar links */
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }

        /* Specific styling for the Logout button */
        .navbar a[href="{% url 'logout_user' %}"] {
            background-color: #333; /* White background */
            color: white; /* Dark color for text */
            border-radius: 15px; /* Slight rounded corners */
            padding: 5px 10px; /* Adjust padding for the Logout button */
            margin-top: 20px; /* Adjust vertical position */
            border: 10px solid #333; /* Optional border to emphasize the button */
        }

        /* Logout button hover effect */
        .navbar a[href="{% url 'logout_user' %}"]:hover {
            background-color: white; /* Dark background on hover */
            color: #333; /* White text on hover */
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3); /* Add shadow on hover */
            transform: scale(1.05); /* Slight scaling effect */
        }

        /* Logo styling */
        .logo {
            padding-right: 20px; /* Space between logo and heading */
        }

        .logo img {
            width: 90px; /* Adjust width as needed */
            height: 90px; /* Ensure height is equal to width for a perfect circle */
            border-radius: 50%; /* Makes the logo circular */
            object-fit: cover; /* Ensures the image is cropped properly within the circle */
            display: block;
        }

        /* Sidebar styling */
        .sidebar {
            margin: 0;
            padding: 0;
            width: 200px;
            background-color: #333; /* Match navbar color */
            position: fixed;
            height: 100%;
            overflow: auto;
        }

        .sidebar a {
            display: block;
            color: white; /* Match navbar text color */
            padding: 16px; /* Keep padding consistent */
            text-decoration: none;
            text-align: left;
            border-radius: 5px; /* Slight rounded corners */
            transition: background-color 0.3s ease, box-shadow 0.3s ease; /* Smooth transition for hover effect */
            margin: 10px 5px 0; /* Added top margin to move buttons down */
        }

        .sidebar a:hover {
            background-color: #ddd; /* Light background on hover */
            color: black; /* Dark text on hover */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Subtle shadow effect */
            transform: scale(1.02); /* Slight scaling effect */
        }

        /* Content styling */
        .content {
            margin-left: 220px;
            padding: 16px;
        }

        .box {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <!-- Navigation bar -->
    <div class="navbar">
        <div class="logo">
            <img src="{% static 'img/meta1.jpg' %}" alt="ECAS Logo"/>
        </div>
        <h1>Welcome to Admin Dashboard</h1>
        <a href="{% url 'logout_user' %}">Logout</a>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <a href="#dashboard">Dashboard</a>
        <a href="{% url 'a_student' %}">Students</a>
        <a href="{% url 'a_teacher' %}">Faculty</a>
    </div>

    <!-- Main content area -->
    <div class="content">
        <div class="box">
            <h2>Overview</h2>
            <p>This section contains an overview of the admin activities.</p>
        </div>

        <div class="box">
            <h2>Recent Feedback</h2>
            <p>View the most recent feedback from users.</p>
        </div>

        <div class="box">
            <h2>Manage Exams</h2>
            <p>Schedule, review, and manage exams here.</p>
        </div>
    </div>

</body>
</html>
