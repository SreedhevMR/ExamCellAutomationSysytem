<!DOCTYPE html>
<html lang="en">
<head>

    <title>Registration Successful</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e3f2fd; /* Light blue background */

            display: flex;

            justify-content: center;
